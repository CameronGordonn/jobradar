# Where jobs come from. Public: this file is committed and drives the scheduled
# GitHub Actions ingest. Personal filters (location, grade, seniority) live in
# config.yaml, which is gitignored.
sources:
  usajobs:
    enabled: true
    # Each keyword x location pair is one query. Keep the list focused; volume grows fast.
    keywords:
      - machine learning
      - data scientist
      - computer vision
      - remote sensing
      - geospatial
      - operations research
      - mathematical statistician
      - energy
    locations:
      - California
      - null            # no location: catches remote postings
    date_posted_days: 14  # API max is 60

  greenhouse:
    enabled: true
    # token = the slug in boards.greenhouse.io/<token>. Check each with:
    #   python -m jobradar.cli probe greenhouse <token>
    # Entries starting with REPLACE are skipped.
    boards:
      # Computer vision, robotics, autonomy
      - {token: samsara, name: "Samsara"}
      - {token: gomotive, name: "Motive"}
      - {token: nuro, name: "Nuro"}
      - {token: figureai, name: "Figure AI"}
      - {token: motional, name: "Motional"}
      - {token: voxel51, name: "Voxel51"}               # CV dataset tooling
      - {token: hover, name: "Hover"}                   # 3D home models from phone photos
      # Geospatial, remote sensing, weather, energy
      - {token: planetlabs, name: "Planet Labs"}
      - {token: tomorrow, name: "Tomorrow.io"}
      - {token: fervoenergy, name: "Fervo Energy"}
      - {token: muonspace, name: "Muon Space"}          # climate and wildfire satellites
      - {token: zestyai, name: "Zesty.ai"}              # property climate risk from aerial imagery
      - {token: aidashinc, name: "AiDash"}              # satellite vegetation management for utilities
      - {token: redwoodmaterials, name: "Redwood Materials"}  # battery recycling, energy storage
      - {token: antora, name: "Antora Energy"}          # thermal batteries
      - {token: rondoenergy, name: "Rondo Energy"}      # heat batteries
      - {token: lunarenergy, name: "Lunar Energy"}      # home batteries
      - {token: energyhub, name: "EnergyHub"}           # distributed energy management
      - {token: relae, name: "Relae (formerly Pachama)"}  # energy and climate advisory, carbon project review
      # Sports analytics
      - {token: hudl, name: "Hudl"}
      - {token: geniussports, name: "Genius Sports"}
      - {token: catapultsports, name: "Catapult"}       # athlete tracking
      # General ML / data
      - {token: anthropic, name: "Anthropic"}
      - {token: databricks, name: "Databricks"}
      - {token: flexport, name: "Flexport"}

  # token = the name in jobs.lever.co/<token>. Check with: python -m jobradar.cli probe lever <token>
  lever:
    enabled: true
    boards:
      - {token: voltus, name: "Voltus"}            # demand response / grid flexibility
      - {token: arcadia, name: "Arcadia"}          # utility data, community solar
      - {token: gridware, name: "Gridware"}        # grid sensing, wildfire risk on power lines
      - {token: jupiterintel, name: "Jupiter Intelligence"}  # climate risk analytics
      - {token: zoox, name: "Zoox"}                # autonomous vehicles
      - {token: waabi, name: "Waabi"}              # autonomous trucking
      - {token: dexterity, name: "Dexterity"}      # robot manipulation

  # token = the name in jobs.ashbyhq.com/<token>. Check with: python -m jobradar.cli probe ashby <token>
  ashby:
    enabled: true
    boards:
      - {token: formenergy, name: "Form Energy"}     # grid batteries
      - {token: span, name: "SPAN"}                  # smart electrical panels
      - {token: leap, name: "Leap"}                  # distributed energy / VPP
      - {token: aurorasolar, name: "Aurora Solar"}   # solar design software, aerial imagery
      - {token: crusoe, name: "Crusoe"}              # energy-first AI cloud
      - {token: watershed, name: "Watershed"}        # carbon accounting
      - {token: mapbox, name: "Mapbox"}              # maps / geospatial
      - {token: teamworks, name: "Teamworks"}        # sports tech
      - {token: carbon-robotics, name: "Carbon Robotics"}  # moved from Greenhouse in Oct 2026; CV for agriculture
      - {token: overstory, name: "Overstory"}        # its Greenhouse board was empty in Oct 2026; vegetation risk from satellite imagery
      - {token: roboflow, name: "Roboflow"}          # computer vision platform
      - {token: windborne-systems, name: "WindBorne Systems"}  # weather balloons, AI forecasting
      - {token: pano-ai, name: "Pano AI"}            # wildfire detection cameras
      - {token: gridcare, name: "GridCARE"}          # grid capacity modeling
      - {token: weave-grid, name: "WeaveGrid"}       # EV charging and the grid
      - {token: element84, name: "Element 84"}       # geospatial and earth observation software
      - {token: firststreet, name: "First Street"}   # climate risk models

# Near-duplicate collapse in the marts (python -m jobradar.pipeline dedupe).
dedupe:
  model: BAAI/bge-small-en-v1.5
  threshold: null   # pending: chosen from hand-marked pairs with `python -m jobradar.pipeline dedupe-eval`
