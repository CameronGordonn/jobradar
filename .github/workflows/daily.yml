name: daily pipeline

# Ingest -> quality checks -> dbt build -> dedupe -> dashboard. Public data only:
# this job never reads the personal config and makes no Claude calls.
on:
  schedule:
    - cron: "17 14 * * *"   # 14:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write    # weekly Parquet backup as a release
  actions: read      # download the previous run's warehouse artifact
  issues: write      # open an issue when a source's row count drops
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  JOBRADAR_WAREHOUSE: ${{ github.workspace }}/data/warehouse.duckdb

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-pipeline.txt

      # After Install, so PyYAML is there. Written to a variable first: a failure inside $(...)
      # passed to echo would not fail the step and would quietly record an empty answer.
      - name: Is a dedupe threshold set?
        id: dedupe
        run: |
          enabled=$(python -c "import yaml; print(str((yaml.safe_load(open('sources.yaml')).get('dedupe') or {}).get('threshold') is not None).lower())")
          echo "enabled=$enabled" | tee -a "$GITHUB_OUTPUT"

      - name: Install the embedding model's dependencies (dedupe only)
        if: steps.dedupe.outputs.enabled == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-eval.txt

      - name: Cache the embedding model
        if: steps.dedupe.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      # The warehouse is passed from run to run as an artifact (90-day retention). If that is
      # gone, fall back to the latest weekly Parquet release. If an earlier successful run
      # exists and neither can be fetched, stop: an empty file would drop the history.
      - name: Restore the warehouse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          prev=$(gh run list --workflow daily.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$prev" ] && gh run download "$prev" --name warehouse --dir data; then
            echo "Restored the artifact from run $prev."
          else
            tag=$(gh release list --limit 50 --json tagName -q '[.[] | select(.tagName | startswith("warehouse-"))][0].tagName')
            if [ -n "$tag" ]; then
              gh release download "$tag" --dir restore
              python -m jobradar.pipeline --db data/warehouse.duckdb restore --dir restore
              echo "::warning::Artifact unavailable; restored from release $tag (up to a week old)."
            elif [ -n "$prev" ]; then
              echo "::error::Run $prev succeeded but neither its artifact nor a backup release could be fetched."
              exit 1
            else
              echo "No earlier successful run or backup: starting a new warehouse."
            fi
          fi
          ls -la data

      - name: Ingest
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          # The USAJOBS adapter skips itself without credentials; fail here with the reason instead.
          if [ -z "$USAJOBS_API_KEY" ] || [ -z "$USAJOBS_EMAIL" ]; then
            echo "::error::Set the USAJOBS_API_KEY and USAJOBS_EMAIL repository secrets."
            exit 1
          fi
          python -m jobradar.pipeline --db data/warehouse.duckdb ingest

      - name: Data quality checks (flags show as warnings on the run)
        run: python -m jobradar.pipeline --db data/warehouse.duckdb quality --flags-out quality_flags.json

      # One open issue per flagged source: comment on it while the problem lasts instead of
      # opening a new one every day.
      - name: Open or update an issue for each flagged source
        continue-on-error: true   # alerting must never block the pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(jq length quality_flags.json)" -gt 0 ] || { echo "No flags."; exit 0; }
          gh label create data-quality --color d93f0b --description "Pipeline data quality alert" --force
          jq -c '.[]' quality_flags.json | while read -r f; do
            src=$(echo "$f" | jq -r .source)
            body=$(echo "$f" | jq -r '"Run \(.run_id): \(.rows_fetched) rows, trailing median \(.trailing_median). \(.reason)\n\nWorkflow run: '"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"'"')
            title="Data quality: $src row count dropped"
            num=$(gh issue list --label data-quality --state open --search "in:title \"$title\"" --json number -q '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --label data-quality --body "$body"; fi
          done

      - name: Upload the warehouse (even if a later step fails, so the ingest isn't lost)
        if: always() && hashFiles('data/warehouse.duckdb') != ''
        uses: actions/upload-artifact@v4
        with:
          name: warehouse
          path: data/warehouse.duckdb
          retention-days: 90

      - name: dbt source freshness
        working-directory: warehouse
        run: dbt source freshness --profiles-dir .

      - name: dbt build (staging and intermediate)
        working-directory: warehouse
        # marts+ = the marts and every test downstream of them; they build after the dedupe step
        run: dbt build --profiles-dir . --exclude "marts+"

      - name: Near-duplicate clusters
        run: python -m jobradar.pipeline --db data/warehouse.duckdb dedupe

      - name: dbt build (marts)
        working-directory: warehouse
        run: dbt build --profiles-dir . --select "marts+"

      - name: Dashboard
        run: python -m jobradar.pipeline --db data/warehouse.duckdb dashboard --out site

      - name: dbt docs (models, columns, tests, lineage) next to the dashboard
        working-directory: warehouse
        run: |
          dbt docs generate --static --profiles-dir .
          mkdir -p ../site/dbt && cp target/static_index.html ../site/dbt/index.html

      # Once per ISO week: a Parquet export as a release, so the history outlives the
      # 90-day artifact retention. Releases are kept; each is a few MB.
      - name: Weekly Parquet backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="warehouse-$(date -u +%G-W%V)"
          if gh release view "$tag" > /dev/null 2>&1; then echo "$tag exists"; exit 0; fi
          python -m jobradar.pipeline --db data/warehouse.duckdb export --out export
          gh release create "$tag" export/* --title "Warehouse backup $(date -u +%G-W%V)" \
            --notes "Raw tables, run logs, dedupe clusters and posting history as Parquet. Restore with: python -m jobradar.pipeline --db data/warehouse.duckdb restore --dir <folder>"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
