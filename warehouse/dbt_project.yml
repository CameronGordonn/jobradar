name: jobradar
version: "1.0.0"
config-version: 2
profile: jobradar

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: [target, dbt_packages]

models:
  jobradar:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  jobradar:
    +schema: reference

flags:
  send_anonymous_usage_stats: false
